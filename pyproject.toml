[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zapzapapi"
version = "0.1.0"
description = "Cliente Python para integração com a API WhatsApp não oficial ZapZapApi."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ZapZapApi Python Client Maintainers" }
]
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zapzapapi"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["zapzapapi"]

